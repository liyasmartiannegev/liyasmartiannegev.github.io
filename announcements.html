<html>
<head>
  <title>LMN - Announcements</title>
  <style>
    body {
      font-family: Gabriola, "Times New Roman", serif;
      color: rgb(35, 130, 99);
      text-align: center;
      margin: 0;
      background: radial-gradient(circle, rgba(174, 0, 255, 0.25) 10%, rgba(0, 255, 162, 0.155) 35%, rgba(7, 206, 153, 0.113) 60%, rgba(0, 0, 0, 0) 100%), 
                  radial-gradient(circle, rgba(0, 255, 255, 0.189) 0%, rgba(150, 81, 234, 0.255) 50%, rgba(255, 255, 255, 0.2) 80%);
    }

    .page-wrapper {
      width: 100%;
      min-height: 100vh; 
      position: relative;
      background: radial-gradient(circle, rgba(156, 45, 230, 0.527), rgba(7, 206, 152, 0.2));
    }

    .copyright {
      position: absolute;
      bottom: -80px; 
      left: 58%;
      transform: translateX(-50%); 
      font-size: 16px;
      color: rgb(117, 40, 194); 
      font-weight: bold;
    }

    .content {
      margin-left: 200px;
    }

    .announcements-section h2 {
      font-size: 96px;  
      font-weight: bold;
      color: rgb(32, 255, 196);  
      font-style: italic;
      font-family: Gabriola, "Times New Roman", serif;  
      margin: 20px 0;
      margin-top: 100px;
      background: linear-gradient(45deg, rgb(150, 81, 234), rgb(7, 206, 152)); 
      -webkit-background-clip: text; 
      background-clip: text;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 15px rgba(0, 255, 255, 0.9);
    }

    .header-container {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      border: 8px solid rgb(117, 40, 194);
      border-image: radial-gradient(circle, rgb(7, 206, 152), rgb(150, 81, 234));
      border-image-slice: 1;
    }

    .header-container:hover {
      background: rgb(166, 252, 215);
    }

    .header-container a {
      text-decoration: none; 
    }

    .site-title {
      text-align: center;
      font-size: 84px;
      color: rgb(114, 16, 211);
      line-height: 0.8;
      margin: 0;
      text-decoration: none; 
      font-weight: bold; 
    }

    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 200px;
      background: rgb(232, 229, 255); 
      border-right: 1px solid #aaa;
      padding-top: 110px;
      text-align: center;
      font-weight: bold;
      height: 100%;
    }

    .sidebar a {
      display: block;
      margin: 10px 10px;
      padding: 10px;
      font-size: 18px;
      background: white;
      border: 1px solid #bbb;
      text-decoration: none;
      color: rgb(35, 130, 99);
    }

    .sidebar a:hover {
      background: rgb(166, 252, 215);
    }

    .sidebar p {
      position: absolute;
      bottom: 10px;  
      width: 100%; 
      text-align: center; 
      font-size: 10px; 
      color: rgb(117, 40, 194); 
    }

    .announcements-section {
      padding: 20px;
      margin-top: 220px;
    }

    .announcement-box {
      background: #fff;
      border: 4px double rgb(7, 206, 152);
      padding: 20px;
      margin-bottom: 20px;
      height: 200px;
      overflow: hidden;
      position: relative;
    }

    .announcement-box:hover {
      background: rgb(166, 252, 215);
    }

    .announcement-date {
      font-size: 24px;
      font-weight: bold;
      color: gray;
      margin-bottom: 10px;
    }

    .announcement-content h3 {
      font-size: 32px;
      color: rgb(117, 40, 194);
      text-align: center;
    }

    .announcement-content p {
      font-size: 24px;
      color: black;
      margin-left: 30px;
      margin-right: 30px;
      height: 48px;
      line-height: 24px;
      overflow: hidden;
      position: relative;
      text-align: left;
      font-family: Gabriola, "Times New Roman", serif;
    }

    .announcement-box:not(.expanded) .announcement-content p::after {
      content: '...';
      position: absolute;
      bottom: 5px;
      right: 0;
      color: rgb(117, 40, 194);
      font-family: Gabriola, "Times New Roman", serif;
    }

    .announcement-box.expanded .announcement-content p {
      height: auto;
    }

    .announcement-box.expanded .announcement-content p::after {
      content: '';
    }

    .close-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 32px;
      background: transparent;
      color: rgb(35, 130, 99);
      border: none;
      cursor: pointer;
      z-index: 1000;
      display: none;
    }

    .announcement-box.expanded {
      position: absolute;
      top: 120px;
      left: 200px;
      width: calc(100vw - 268px);
      height: calc(100vh - 68px);
      z-index: 999;
      overflow: auto;
      padding: 30px;
      border: 4px double rgb(7, 206, 152);
      background: white;
    }

    .announcement-box.expanded .close-btn {
      display: block;
    }

    .subscribe-box {
      background: rgb(148, 64, 250);
      color: rgb(165, 253, 219);
      padding: 20px;
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: calc(100vw - 240px);
      position: absolute;
      top: 120px;
      left: 200px;
    }

    .subscribe-box input[type="email"] {
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid rgb(35, 130, 99);
    }

    .subscribe-box button {
      padding: 10px 20px;
      margin-top: 10px;
      background-color: rgb(9, 188, 140);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .subscribe-box button:hover {
      background-color: rgb(35, 130, 99);
    }

    .subscribe-count {
      font-size: 36px; 
      font-weight: bold; 
      color: rgb(148, 45, 251); 
      background: rgb(11, 240, 179); 
      padding: 20px;
      border-radius: 10px;
      width: 280px;
      margin-top: 20px;
      margin-left: 20px;
      border: 4px solid rgb(132, 247, 216); 
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); 
    }

  </style>
</head>
<body>

  <div class="page-wrapper">
    <div class="content">
      <div class="header-container">
        <a href="index.html"><h1 class="site-title">Liya's Martian Negev</h1></a>
        <div class="header-line"></div>
        <p class="copyright">© Liya's Martian Negev</p>
      </div>

      <div class="subscribe-box">
        <h2>Subscribe to LMN to receive announcements directly!</h2>
        <input type="email" id="email" placeholder="Enter your email">
        <button id="subscribe-btn">Subscribe</button>
        <div class="subscribe-count" id="subscriber-count">Subscribers: 0</div>
      </div>

      <div class="announcements-section">
        <h2>LMN News!</h2>

        <div class="announcement-box">
          <div class="announcement-date">April 26, 2026</div>
          <div class="announcement-content">
            <h3>My first two papers are posted!</h3>
            <p>Announcement 2 text.</p>
          </div>
        </div>

        <div class="announcement-box">
          <div class="announcement-date">April 26, 2026</div>
          <div class="announcement-content">
            <h3>LMN is launched!</h3>
            <p>Announcement 1 text.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <a href="index.html">Home</a>
      <a href="announcements.html">Announcements</a>
      <a href="papers.html">Papers</a>
    </div>
  </div>

  <script>
subscribeBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value;

  if (!email) {
    alert("Please enter email");
    return;
  }

  try {
    await fetch("https://script.google.com/macros/s/AKfycbzXgqwnLeUfn3wdLUkSAkElIWcSOWqUQlFTLt-py_agpwnQR1ANUOF8cmrWsbhTReX5/exec", {
      method: "POST",
      body: JSON.stringify({ email: email })
    });

    // Update subscriber count globally
    await updateSubscriberCount();

    document.getElementById('email').value = '';
    alert("Thank you for subscribing!");
  } catch (err) {
    console.error("Subscription failed", err);
    alert("Failed to subscribe. Try again later.");
  }
});
  </script> 
</body>
</html>
